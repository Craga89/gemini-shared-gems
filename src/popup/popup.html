<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Gems</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Gemini Gems</h1>
      <p class="subtitle">Discover AI insights</p>
    </header>

    <main>
      <section class="gem-list">
        <h2>Recent Gems</h2>
        <ul id="gemsList">
          <li class="placeholder">No gems saved yet. Start exploring!</li>
        </ul>
      </section>

      <section class="actions">
        <button id="captureBtn" class="btn btn-primary">Capture Gem</button>
        <button id="openOptionsBtn" class="btn btn-secondary">Settings</button>
      </section>
    </main>

    <footer>
      <p class="version">v1.0.0</p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
